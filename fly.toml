# fly.toml app configuration file generated for decohomz-api on 2026-05-08T08:24:55+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decohomz-api'
primary_region = 'cdg'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://decohomz-api.fly.dev'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/data/database.sqlite'
  CACHE_STORE = 'file'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  QUEUE_CONNECTION = 'sync'
  FILESYSTEM_DISK = 'local'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'decohomz_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
